<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>NES（纯静态页，本地ROM）</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif;
           background:#111; color:#eee; margin:20px; }
    #screen { width: 512px; height: 480px; background:#000; border:1px solid #444; outline:none;
              image-rendering: pixelated; image-rendering: crisp-edges; }
    .toolbar { margin: 10px 0; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button, input[type="file"] { font-size: 14px; }
    small { opacity:.8 }
    @media (max-width: 560px) {
      #screen { width: 256px; height: 240px; }
    }
  </style>
</head>
<body>
  <h2>NES（本地ROM，纯前端运行）</h2>
  <canvas id="screen" width="256" height="240" tabindex="0"></canvas>
  <div class="toolbar">
    <input type="file" id="rom" accept=".nes">
    <button id="pauseBtn" disabled>暂停</button>
    <button id="resetBtn" disabled>重置</button>
    <label><input type="checkbox" id="soundChk" checked> 声音</label>
  </div>
  <div><small>键位：方向键=移动，Z=A，X=B，Enter=Start，右Shift=Select。首次播放音频可能需要点击页面/按钮以解锁声音。</small></div>
  <!-- jsnes (纯JS NES模拟器) -->
  <script src="https://cdn.jsdelivr.net/npm/jsnes@0.8.0/dist/jsnes.min.js"></script>
  <script>
    // 画面
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d', { alpha: false });
    const imageData = ctx.createImageData(256, 240);
    // 音频（简易环形缓冲，需用户手势启动）
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null, scriptNode = null;
    const SAMPLE_BUFFER_SIZE = 2048;
    let audioEnabled = true;
    const BUF_LEN = 16384; // 双声道环形缓冲长度
    let leftBuf = new Float32Array(BUF_LEN);
    let rightBuf = new Float32Array(BUF_LEN);
    let wptr = 0, rptr = 0;
    function pushSample(L, R) {
      const next = (wptr + 1) % BUF_LEN;
      if (next === rptr) { /* 溢出丢样本 */ return; }
      leftBuf[wptr] = L; rightBuf[wptr] = R; wptr = next;
    }
    function pullSamples(outL, outR) {
      for (let i = 0; i < outL.length; i++) {
        if (rptr === wptr) { outL[i] = 0; outR[i] = 0; }
        else { outL[i] = leftBuf[rptr]; outR[i] = rightBuf[rptr]; rptr = (rptr + 1) % BUF_LEN; }
      }
    }
    function initAudio(sampleRate) {
      if (!audioEnabled || audioCtx) return;
      audioCtx = new AudioContext({ sampleRate: sampleRate || 44100 });
      scriptNode = audioCtx.createScriptProcessor(SAMPLE_BUFFER_SIZE, 0, 2);
      scriptNode.onaudioprocess = e => {
        pullSamples(e.outputBuffer.getChannelData(0), e.outputBuffer.getChannelData(1));
      };
      scriptNode.connect(audioCtx.destination);
    }
    // NES 实例
    const nes = new jsnes.NES({
      onFrame: function (fb) { // fb: 256*240*3
        for (let i = 0, j = 0; i < imageData.data.length; i += 4, j += 3) {
          imageData.data[i] = fb[j];
          imageData.data[i + 1] = fb[j + 1];
          imageData.data[i + 2] = fb[j + 2];
          imageData.data[i + 3] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
      },
      onAudioSample: function (L, R) { pushSample(L, R); },
      onStatusUpdate: function () { /* 可打印状态 */ }
    });
    if (nes.setSampleRate) { try { nes.setSampleRate(44100); } catch (e) {} }
    // 主循环（以 60fps 目标驱动）
    let running = false, last = 0, acc = 0;
    const STEP = 1000 / 60;
    function loop(ts) {
      if (!running) return;
      if (!last) last = ts;
      let dt = ts - last; if (dt > 1000) dt = 1000; // 背景/切出防抖
      last = ts; acc += dt;
      while (acc >= STEP) { nes.frame(); acc -= STEP; }
      requestAnimationFrame(loop);
    }
    function start() {
      if (!running) {
        running = true; last = 0; acc = 0; requestAnimationFrame(loop);
      }
    }
    function stop() { running = false; }
    // 交互控件
    const romInput = document.getElementById('rom');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const soundChk = document.getElementById('soundChk');
    soundChk.addEventListener('change', () => {
      audioEnabled = soundChk.checked;
      if (audioEnabled && !audioCtx) initAudio();
      if (!audioEnabled && audioCtx) {
        scriptNode && scriptNode.disconnect();
        audioCtx.close(); audioCtx = null; scriptNode = null;
      }
    });
    romInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      // jsnes.loadROM 期望“二进制字符串”，做一次转换（分块避免参数过长）
      const bytes = new Uint8Array(buf);
      let binary = '';
      const CHUNK = 0x8000;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        const sub = bytes.subarray(i, i + CHUNK);
        binary += String.fromCharCode.apply(null, sub);
      }
      nes.loadROM(binary);
      initAudio(44100); // 需要用户手势才能真正发声，加载即视为手势
      nes.frame();      // 先渲染一帧
      start();
      pauseBtn.disabled = false;
      resetBtn.disabled = false;
      pauseBtn.textContent = '暂停';
      canvas.focus();
    });
    pauseBtn.addEventListener('click', () => {
      if (running) {
        stop();
        pauseBtn.textContent = '继续';
      } else {
        start();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        pauseBtn.textContent = '暂停';
      }
    });
    resetBtn.addEventListener('click', () => { nes.reset(); });
    // 键盘映射
    const KEY = { LEFT:37, UP:38, RIGHT:39, DOWN:40, Z:90, X:88, ENTER:13, SHIFT:16 };
    const P1 = 1;
    window.addEventListener('keydown', (e) => {
      switch (e.keyCode) {
        case KEY.LEFT:  nes.buttonDown(P1, jsnes.Controller.BUTTON_LEFT);  e.preventDefault(); break;
        case KEY.RIGHT: nes.buttonDown(P1, jsnes.Controller.BUTTON_RIGHT); e.preventDefault(); break;
        case KEY.UP:    nes.buttonDown(P1, jsnes.Controller.BUTTON_UP);    e.preventDefault(); break;
        case KEY.DOWN:  nes.buttonDown(P1, jsnes.Controller.BUTTON_DOWN);  e.preventDefault(); break;
        case KEY.Z:     nes.buttonDown(P1, jsnes.Controller.BUTTON_A);     e.preventDefault(); break;
        case KEY.X:     nes.buttonDown(P1, jsnes.Controller.BUTTON_B);     e.preventDefault(); break;
        case KEY.ENTER: nes.buttonDown(P1, jsnes.Controller.BUTTON_START); e.preventDefault(); break;
        case KEY.SHIFT: nes.buttonDown(P1, jsnes.Controller.BUTTON_SELECT);e.preventDefault(); break;
      }
    });
    window.addEventListener('keyup', (e) => {
      switch (e.keyCode) {
        case KEY.LEFT:  nes.buttonUp(P1, jsnes.Controller.BUTTON_LEFT);  e.preventDefault(); break;
        case KEY.RIGHT: nes.buttonUp(P1, jsnes.Controller.BUTTON_RIGHT); e.preventDefault(); break;
        case KEY.UP:    nes.buttonUp(P1, jsnes.Controller.BUTTON_UP);    e.preventDefault(); break;
        case KEY.DOWN:  nes.buttonUp(P1, jsnes.Controller.BUTTON_DOWN);  e.preventDefault(); break;
        case KEY.Z:     nes.buttonUp(P1, jsnes.Controller.BUTTON_A);     e.preventDefault(); break;
        case KEY.X:     nes.buttonUp(P1, jsnes.Controller.BUTTON_B);     e.preventDefault(); break;
        case KEY.ENTER: nes.buttonUp(P1, jsnes.Controller.BUTTON_START); e.preventDefault(); break;
        case KEY.SHIFT: nes.buttonUp(P1, jsnes.Controller.BUTTON_SELECT);e.preventDefault(); break;
      }
    });
    // 点击画布以获取焦点和恢复音频
    canvas.addEventListener('pointerdown', () => {
      canvas.focus();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    });
  </script>
  <p><small>
    使用说明：将本文件保存为 nes.html 并在浏览器中打开，点击“选择文件”加载你自己合法获得的 .nes ROM，即可直接游玩。
    这完全在浏览器本地运行，不需要服务器；若托管在静态空间（如 GitHub Pages），同样可用。
  </small></p>
</body>
</html>
