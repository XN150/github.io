<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Tank - Q版泡泡堂7</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2c3e50, #4a235a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            width: 100%;
            max-width: 1000px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            max-width: 700px;
            margin: 0 auto 20px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .btn {
            background: linear-gradient(to right, #ff8c00, #ff6600);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 102, 0, 0.5);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn.secondary {
            background: linear-gradient(to right, #3498db, #2980b9);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .size-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 50px;
            margin-top: 15px;
        }
        
        .size-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .size-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .size-display {
            min-width: 100px;
            text-align: center;
            font-weight: bold;
        }
        
        #game-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        
        #game-container {
            width: 100%;
            height: 0;
            padding-bottom: 75%; /* 4:3 宽高比 (720/960=0.75) */
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }
        
        #game-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            padding-bottom: 0;
            border-radius: 0;
        }
        
        ruffle-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .instructions {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
            width: 100%;
            max-width: 1000px;
        }
        
        .instructions h2 {
            color: #00ccff;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .instructions ul {
            padding-left: 25px;
            line-height: 1.8;
        }
        
        .instructions li {
            margin-bottom: 10px;
        }
        
        .instructions strong {
            color: #ffcc00;
        }
        
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        .performance-panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
            display: flex;
            gap: 15px;
        }
        
        .performance-metric {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .metric-value {
            font-weight: bold;
            color: #00ff99;
        }
        
        .loading-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #00ff99, #00ccff);
            transition: width 0.5s ease;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            .performance-panel {
                flex-direction: column;
                gap: 8px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .size-controls {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Bubble Tank</h1>
        <p class="subtitle">调整下方控制按钮改变游戏窗口大小</p>
        
        <div class="controls">
            <button id="fullscreen-btn" class="btn">全屏模式</button>
            <button id="reset-btn" class="btn secondary">重置尺寸</button>
            <button id="perf-btn" class="btn secondary">性能面板</button>
        </div>
        
        <div class="size-controls">
            <button id="size-down" class="size-btn">-</button>
            <div class="size-display">100%</div>
            <button id="size-up" class="size-btn">+</button>
        </div>
        
        <div class="loading-bar">
            <div class="loading-progress" id="loading-progress"></div>
        </div>
        
        <div class="performance-panel" id="performance-panel" style="display: none;">
            <div class="performance-metric">
                <span>FPS: </span>
                <span class="metric-value" id="fps-counter">0</span>
            </div>
            <div class="performance-metric">
                <span>内存: </span>
                <span class="metric-value" id="memory-usage">0 MB</span>
            </div>
            <div class="performance-metric">
                <span>加载: </span>
                <span class="metric-value" id="load-status">等待中...</span>
            </div>
        </div>
    </header>
    
    <div id="game-wrapper">
        <div id="game-container">
            <!-- Ruffle播放器将在这里加载 -->
        </div>
    </div>
    
    <div class="instructions">
        <h2>游戏说明 & 性能优化提示</h2>
        <ul>
            <li>Bubble Tank（Q版泡泡堂7）是一款经典的泡泡射击类小游戏。</li>
            <li>你将控制泡泡坦克，在泡泡世界中消灭敌人，收集气泡并不断升级。</li>
            <li>使用<strong>方向键</strong>或<strong>WASD</strong>移动，<strong>鼠标点击</strong>射击。</li>
            <li>收集更多气泡可以让你的坦克变得更强大。</li>
            <li>注意躲避敌人的攻击，挑战更高分数！</li>
            <li><strong>性能提示</strong>: 如果游戏卡顿，尝试关闭其他标签页，降低游戏画质或减少同时运行的程序。</li>
        </ul>
    </div>
    
    <footer>
        <p>Bubble Tank | Q版泡泡堂7 中文版</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('game-container');
            const gameWrapper = document.getElementById('game-wrapper');
            const sizeDisplay = document.querySelector('.size-display');
            const sizeDownBtn = document.getElementById('size-down');
            const sizeUpBtn = document.getElementById('size-up');
            const resetBtn = document.getElementById('reset-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const perfBtn = document.getElementById('perf-btn');
            const perfPanel = document.getElementById('performance-panel');
            const fpsCounter = document.getElementById('fps-counter');
            const memoryUsage = document.getElementById('memory-usage');
            const loadStatus = document.getElementById('load-status');
            const loadingProgress = document.getElementById('loading-progress');
            
            // 性能监控变量
            let fps = 0;
            let frameCount = 0;
            let lastTime = performance.now();
            let perfMonitorInterval;
            
            // 初始尺寸设置
            let scale = 1;
            const maxScale = 1.5;
            const minScale = 0.6;
            const scaleStep = 0.1;
            
            // 更新尺寸显示
            function updateSizeDisplay() {
                sizeDisplay.textContent = `${Math.round(scale * 100)}%`;
                gameWrapper.style.maxWidth = `${1000 * scale}px`;
            }
            
            // 缩小游戏
            sizeDownBtn.addEventListener('click', () => {
                if (scale > minScale) {
                    scale -= scaleStep;
                    updateSizeDisplay();
                }
            });
            
            // 放大游戏
            sizeUpBtn.addEventListener('click', () => {
                if (scale < maxScale) {
                    scale += scaleStep;
                    updateSizeDisplay();
                }
            });
            
            // 重置尺寸
            resetBtn.addEventListener('click', () => {
                scale = 1;
                updateSizeDisplay();
                if (container.classList.contains('fullscreen')) {
                    exitFullscreen();
                }
            });
            
            // 全屏功能
            fullscreenBtn.addEventListener('click', () => {
                if (!container.classList.contains('fullscreen')) {
                    container.classList.add('fullscreen');
                    fullscreenBtn.textContent = '退出全屏';
                } else {
                    exitFullscreen();
                }
            });
            
            // 性能面板切换
            perfBtn.addEventListener('click', () => {
                const isVisible = perfPanel.style.display !== 'none';
                perfPanel.style.display = isVisible ? 'none' : 'flex';
                perfBtn.textContent = isVisible ? '性能面板' : '隐藏面板';
            });
            
            // 退出全屏
            function exitFullscreen() {
                container.classList.remove('fullscreen');
                fullscreenBtn.textContent = '全屏模式';
            }
            
            // 初始化显示
            updateSizeDisplay();
            
            // 性能监控函数
            function startPerformanceMonitoring() {
                // FPS计算
                function updateFPS() {
                    const now = performance.now();
                    frameCount++;
                    
                    if (now >= lastTime + 1000) {
                        fps = Math.round((frameCount * 1000) / (now - lastTime));
                        fpsCounter.textContent = fps;
                        frameCount = 0;
                        lastTime = now;
                        
                        // 低FPS警告
                        if (fps < 25) {
                            fpsCounter.style.color = '#ff5555';
                        } else if (fps < 45) {
                            fpsCounter.style.color = '#ffcc00';
                        } else {
                            fpsCounter.style.color = '#00ff99';
                        }
                    }
                    requestAnimationFrame(updateFPS);
                }
                
                // 内存使用估算（非精确值）
                function updateMemoryUsage() {
                    if (performance.memory) {
                        const usedMB = Math.round(performance.memory.usedJSHeapSize / 1048576);
                        memoryUsage.textContent = `${usedMB} MB`;
                        if (usedMB > 500) {
                            memoryUsage.style.color = '#ff5555';
                        } else if (usedMB > 300) {
                            memoryUsage.style.color = '#ffcc00';
                        } else {
                            memoryUsage.style.color = '#00ff99';
                        }
                    } else {
                        memoryUsage.textContent = 'N/A';
                    }
                }
                
                updateFPS();
                setInterval(updateMemoryUsage, 2000);
            }
            
            // 加载Ruffle播放器
            window.RufflePlayer = window.RufflePlayer || {};
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);
            
            // 模拟加载进度
            let loadProgress = 0;
            const loadInterval = setInterval(() => {
                loadProgress += Math.random() * 10;
                if (loadProgress > 90) clearInterval(loadInterval);
                loadingProgress.style.width = `${loadProgress}%`;
            }, 300);
            
            // 加载游戏SWF文件
            player.load("bubble-tkank.swf").then(() => {
                console.log("游戏加载成功");
                loadingProgress.style.width = '100%';
                loadStatus.textContent = '加载完成';
                loadStatus.style.color = '#00ff99';
                
                // 开始性能监控
                startPerformanceMonitoring();
                
                // 游戏加载完成后显示性能提示
                setTimeout(() => {
                    perfPanel.style.display = 'flex';
                    perfBtn.textContent = '隐藏面板';
                }, 3000);
            }).catch((e) => {
                console.error("游戏加载失败:", e);
                clearInterval(loadInterval);
                loadingProgress.style.width = '100%';
                loadingProgress.style.background = '#ff5555';
                loadStatus.textContent = '加载失败';
                loadStatus.style.color = '#ff5555';
                
                container.innerHTML = `
                    <div style="position:absolute; top:0; left:0; width:100%; height:100%; 
                                display:flex; flex-direction:column; justify-content:center; 
                                align-items:center; background:rgba(0,0,0,0.8); color:white; 
                                padding:20px; text-align:center;">
                        <h2 style="color:#ff5555; margin-bottom:20px;">游戏加载失败</h2>
                        <p>无法加载游戏文件 bubble-tkank.swf</p>
                        <p style="margin-top:10px; font-size:0.9em; opacity:0.7;">${e.message}</p>
                        <button onclick="window.location.reload()" 
                                style="margin-top:25px; padding:10px 25px; background:#ff6600; 
                                       border:none; border-radius:5px; color:white; cursor:pointer;">
                            重新加载
                        </button>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
