<div id="game-wrapper">
    <div id="game-container">
        <!-- Ruffle 播放器将在这里加载 -->
    </div>
</div>
<div class="instructions">
    <h2>游戏说明 & 性能提示</h2>
    <ul>
        <li>Bubble Tank（Q版泡泡堂7）是一款经典的泡泡射击类小游戏。</li>
        <li>使用方向键或 WASD 移动，鼠标点击射击。</li>
        <li>本页面通过“固定内部分辨率 + CSS 缩放”提升流畅度；如仍卡顿，可尝试降低缩放或点击“重置尺寸”。</li>
        <li>确保浏览器已开启硬件加速；必要时在系统/NVIDIA 设置中将浏览器设为高性能 GPU。</li>
    </ul>
</div>
<footer>
    <p>Bubble Tank | Q版泡泡堂7</p>
</footer>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Ruffle 全局配置（优先 WebGL、降低质量）
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = Object.assign({}, window.RufflePlayer.config || {}, {
            preferredRenderer: 'webgl',
            quality: 'low',
            letterbox: 'fullscreen',
            logLevel: 'error'
        });
        // 基础元素
        const gameWrapper = document.getElementById('game-wrapper');
        const container   = document.getElementById('game-container');
        const sizeDisplay = document.querySelector('.size-display');
        const sizeDownBtn = document.getElementById('size-down');
        const sizeUpBtn   = document.getElementById('size-up');
        const resetBtn    = document.getElementById('reset-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const perfBtn     = document.getElementById('perf-btn');
        const perfPanel   = document.getElementById('performance-panel');
        const fpsCounter  = document.getElementById('fps-counter');
        const memoryUsage = document.getElementById('memory-usage');
        const loadStatus  = document.getElementById('load-status');
        const loadingProgress = document.getElementById('loading-progress');
        // 固定内部分辨率
        const BASE_W = 800, BASE_H = 600;
        // 缩放参数（仅通过 CSS transform 缩放显示，不改变内部渲染分辨率）
        let scale = 1;
        const maxScale = 1.8; // 可按机器能力调整
        const minScale = 0.6;
        const scaleStep = 0.1;
        function applyScale(s) {
            container.style.transform = `scale(${s})`;
        }
        function updateSizeDisplay() {
            sizeDisplay.textContent = `${Math.round(scale * 100)}%`;
            applyScale(scale);
        }
        // 按钮：缩小/放大（全屏时禁用）
        sizeDownBtn.addEventListener('click', () => {
            if (gameWrapper.classList.contains('fullscreen')) return;
            if (scale > minScale) {
                scale = +(scale - scaleStep).toFixed(2);
                updateSizeDisplay();
            }
        });
        sizeUpBtn.addEventListener('click', () => {
            if (gameWrapper.classList.contains('fullscreen')) return;
            if (scale < maxScale) {
                scale = +(scale + scaleStep).toFixed(2);
                updateSizeDisplay();
            }
        });
        resetBtn.addEventListener('click', () => {
            scale = 1;
            updateSizeDisplay();
            if (gameWrapper.classList.contains('fullscreen')) exitFullscreen();
        });
        // 全屏按屏幕自适应比例缩放，仍然只缩放，不改内部分辨率
        function enterFullscreen() {
            gameWrapper.classList.add('fullscreen');
            resizeFullscreen();
            fullscreenBtn.textContent = '退出全屏';
        }
        function exitFullscreen() {
            gameWrapper.classList.remove('fullscreen');
            applyScale(scale);
            fullscreenBtn.textContent = '全屏模式';
        }
        function resizeFullscreen() {
            if (!gameWrapper.classList.contains('fullscreen')) return;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const fit = Math.min(vw / BASE_W, vh / BASE_H);
            const capped = Math.min(fit, maxScale);
            applyScale(capped);
        }
        fullscreenBtn.addEventListener('click', () => {
            if (!gameWrapper.classList.contains('fullscreen')) enterFullscreen();
            else exitFullscreen();
        });
        window.addEventListener('resize', resizeFullscreen);
        // 性能面板显示/隐藏
        perfBtn.addEventListener('click', () => {
            const isVisible = perfPanel.style.display !== 'none';
            perfPanel.style.display = isVisible ? 'none' : 'flex';
            perfBtn.textContent = isVisible ? '性能面板' : '隐藏面板';
        });
        // 初始化显示
        updateSizeDisplay();
        // 性能监控（FPS + 内存）
        function startPerformanceMonitoring() {
            let fps = 0, frameCount = 0, lastTime = performance.now();
            function updateFPS() {
                const now = performance.now();
                frameCount++;
                if (now >= lastTime + 1000) {
                    fps = Math.round((frameCount * 1000) / (now - lastTime));
                    fpsCounter.textContent = fps;
                    frameCount = 0;
                    lastTime = now;
                    if (fps < 25) fpsCounter.style.color = '#ff5555';
                    else if (fps < 45) fpsCounter.style.color = '#ffcc00';
                    else fpsCounter.style.color = '#00ff99';
                }
                requestAnimationFrame(updateFPS);
            }
            function updateMemoryUsage() {
                if (performance && performance.memory) {
                    const usedMB = Math.round(performance.memory.usedJSHeapSize / 1048576);
                    memoryUsage.textContent = `${usedMB} MB`;
                    if (usedMB > 500) memoryUsage.style.color = '#ff5555';
                    else if (usedMB > 300) memoryUsage.style.color = '#ffcc00';
                    else memoryUsage.style.color = '#00ff99';
                } else {
                    memoryUsage.textContent = 'N/A';
                }
            }
            updateFPS();
            setInterval(updateMemoryUsage, 2000);
        }
        // 创建并加载 Ruffle 播放器
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        // 双保险：设置属性（不同版本命名可能不同）
        player.setAttribute('preferred_renderer', 'webgl');
        player.setAttribute('preferredrenderer', 'webgl');
        player.setAttribute('quality', 'low');
        player.setAttribute('letterbox', 'fullscreen');
        container.appendChild(player);
        // 模拟加载进度（仅 UI）
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.random() * 10;
            if (loadProgress >= 90) clearInterval(loadInterval);
            loadingProgress.style.width = `${Math.min(loadProgress, 90)}%`;
        }, 250);
        player.load('bubble-tank.swf').then(() => {
            loadingProgress.style.width = '100%';
            loadStatus.textContent = '加载完成';
            loadStatus.style.color = '#00ff99';
            // 启动性能监控
            startPerformanceMonitoring();
            // 默认展开性能面板几秒后由你决定是否关闭
            setTimeout(() => {
                perfPanel.style.display = 'flex';
                perfBtn.textContent = '隐藏面板';
            }, 800);
        }).catch((e) => {
            console.error('游戏加载失败:', e);
            clearInterval(loadInterval);
            loadingProgress.style.width = '100%';
            loadingProgress.style.background = '#ff5555';
            loadStatus.textContent = '加载失败';
            loadStatus.style.color = '#ff5555';
            container.innerHTML = `
                <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.8);color:#fff;padding:20px;text-align:center;">
                    <h2 style="color:#ff5555;margin-bottom:18px;">游戏加载失败</h2>
                    <p>无法加载游戏文件 bubble-tank.swf</p>
                    <p style="margin-top:10px;font-size:0.9em;opacity:0.75;">${e.message || ''}</p>
                    <button onclick="window.location.reload()"
                        style="margin-top:22px;padding:10px 22px;background:#ff6600;border:none;border-radius:6px;color:white;cursor:pointer;">
                        重新加载
                    </button>
                </div>
            `;
        });
    });
</script>
